name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: YagoBorba/diagnostic-profile@v0.2.0
        with:
          config: diagnostic-profile.json
          output_dir: dist
      - name: Verify external consumption
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
          assert.equal(manifest.source, 'github');
          assert.equal(manifest.version, '0.2.0');
          const readme = readFileSync('dist/README.snippet.md', 'utf8');
          assert.ok(readme.includes('https://github.com/YagoBorba/diagnostic-profile'));
          assert.ok(readme.includes('>Yago Borba</a>'));
          assert.ok(readFileSync('dist/header-dark.svg', 'utf8').includes('<svg'));
          NODE
