name: Build profile assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostic-profile.json"
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: "diagnostic-profile-YagoBorba/diagnostic-profile-example-output"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check publication destination
        env:
          TARGET_BRANCH: "output"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_REPOSITORY: "YagoBorba/diagnostic-profile-example"
          CURRENT_REPOSITORY: ${{ github.repository }}
          PROFILE_PUBLISH_TOKEN: ${{ secrets.PROFILE_PUBLISH_TOKEN }}
        run: |
          if [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Choose a dedicated asset branch, not the default source branch."
            exit 1
          fi
          shopt -s nocasematch
          if [[ "$TARGET_REPOSITORY" != "$CURRENT_REPOSITORY" && -z "$PROFILE_PUBLISH_TOKEN" ]]; then
            echo "::error::Publishing to another repository requires the PROFILE_PUBLISH_TOKEN secret."
            exit 1
          fi
      # Versioned release; pin its full commit SHA for an immutable reference.
      - uses: YagoBorba/diagnostic-profile@v0.2.0
        with:
          config: "diagnostic-profile.json"
          output_dir: "dist"
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          repo: "YagoBorba/diagnostic-profile-example"
          target_branch: "output"
          build_dir: "dist"
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
